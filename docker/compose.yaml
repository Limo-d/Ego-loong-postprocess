services:
  postprocess:
    image: ${IMAGE_TAG:-ego-loong-postprocess:ubuntu24.04-cuda13.0}
    gpus: all
    shm_size: 16gb
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /opt/ego-loong-postprocess
    environment:
      TZ: Asia/Shanghai
      HOME: /tmp/ego-loong-home
    volumes:
      - ${INPUT_ROOT:-/home/lenovo/Downloads}:/data/input:ro
      - ${OUTPUT_ROOT:-/home/lenovo/Ego-loong-postprocess/postprocess_data}:/opt/ego-loong-postprocess/postprocess_data
      - ${CACHE_ROOT:-/home/lenovo/.cache/ego-loong-container}:/cache
    stdin_open: true
    tty: true
    command: bash

